name: runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: shell-control
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25)
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            apt_options+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c
        with:
          workspaces: shell-control/src-tauri -> target
          cache-on-failure: true
      - run: bun install --frozen-lockfile --ignore-scripts --registry https://registry.npmjs.org
      - name: Record runner and package
        run: |
          mkdir -p results
          {
            uname -a
            echo "$RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion"
            rustc --version
            bun --version
            bun package.ts
          } 2>&1 | tee results/package.log
      - name: Exercise installed Linux package
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          dbus-run-session -- xvfb-run -a bun run.ts /usr/bin/shell-control results/probe
      - name: Exercise installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          bun run.ts "$env:LOCALAPPDATA/ShellControlProbe/shell-control.exe" results/probe
          exit $LASTEXITCODE
      - name: Exercise macOS app
        if: runner.os == 'macOS'
        run: bun run.ts src-tauri/target/release/bundle/macos/ShellControlProbe.app/Contents/MacOS/shell-control results/probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shell-control-${{ matrix.os }}
          path: |
            shell-control/results/**/*.log
            shell-control/results/**/*.json
            shell-control/results/**/*.jsonl
          if-no-files-found: warn
