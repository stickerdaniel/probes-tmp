name: compiled entry
on:
  workflow_dispatch:
  push:
    branches: [probe/compiled-entry]
    paths-ignore: [compiled-entry/RESULT.md]
permissions:
  contents: read
concurrency:
  group: compiled-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: compiled-entry
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: |
          echo "$RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion"
          bun --revision
          bun probe.ts results/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compiled-entry-${{ matrix.os }}
          path: compiled-entry/results/result.json
          if-no-files-found: error
