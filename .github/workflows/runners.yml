name: unary-contract
on:
  workflow_dispatch:
  push:
    branches: [probe/unary-contract]
    paths-ignore: [unary-contract/RESULT.md]
permissions:
  contents: read
concurrency:
  group: unary-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: unary-contract
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: bun install --frozen-lockfile --ignore-scripts --registry https://registry.npmjs.org
      - run: cargo fetch --locked
      - name: Verify exported and generated bytes
        run: |
          mkdir -p results
          {
            uname -a
            echo "$RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion"
            bun --version
            rustc --version
          } | tee results/platform.log
          bun exports.ts --check
          cargo build --locked --offline --bins 2>&1 | tee results/build.log
          generator=target/debug/generate
          if [[ "$RUNNER_OS" == Windows ]]; then generator+=.exe; fi
          "$generator" > results/generated.rs
          cmp src/generated.rs results/generated.rs
          bun -e 'console.log(Bun.CryptoHasher.hash("sha256", await Bun.file("results/generated.rs").bytes(), "hex"))' | tee results/generated.sha256
      - name: Exercise Rust handlers
        run: bun run.ts | tee results/cases.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: unary-contract-${{ matrix.os }}
          path: unary-contract/results/
          if-no-files-found: warn
