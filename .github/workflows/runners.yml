name: runners
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Probe duration
        type: choice
        options: [smoke, long]
        default: smoke
permissions:
  contents: read
jobs:
  extension-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        case: ${{ fromJSON(inputs.variant == 'smoke' && '["smoke"]' || '["native-1","native-25","native-35","runtime-35","runtime-300","followups"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.variant == 'smoke' && 7 || (matrix.case == 'followups' && 7 || 37) }}
    defaults:
      run:
        working-directory: extension-worker
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Measure Chrome Stable
        env:
          PROBE_CASE: ${{ matrix.case }}
        timeout-minutes: ${{ inputs.variant == 'smoke' && 3 || (matrix.case == 'followups' && 4 || 34) }}
        run: node probe.mjs "$PROBE_CASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: extension-worker-${{ matrix.os }}-${{ matrix.case }}
          path: extension-worker/results/*.json
          if-no-files-found: warn
