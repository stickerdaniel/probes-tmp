name: runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  info:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          uname -a
          echo "$RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion"
