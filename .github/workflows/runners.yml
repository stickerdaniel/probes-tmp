name: runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interpreter-process:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interpreter-process
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --ignore-scripts --frozen-lockfile --registry https://registry.npmjs.org
      - run: python test262.py
      - run: python -u run.py
