name: runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-timezone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --cwd cli-timezone --ignore-scripts --frozen-lockfile --registry https://registry.npmjs.org
      - name: Prepare the file access tracer
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p .probe-output
          curl -fsSL https://archive.ubuntu.com/ubuntu/pool/main/s/strace/strace_6.8-0ubuntu2_amd64.deb -o .probe-output/strace.deb
          printf '%s  %s\n' d588810ae26b06fee6678dc81e5b54f6efcde8e718e4589adb4d11d254b9820b .probe-output/strace.deb | sha256sum -c
          dpkg-deb -x .probe-output/strace.deb .probe-output/strace
      - run: bun cli-timezone/run.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cli-timezone-${{ matrix.os }}
          path: .probe-output/result.json
          include-hidden-files: true
          if-no-files-found: error
