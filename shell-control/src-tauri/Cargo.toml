[package]
name = "shell-control"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-autostart = "=2.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_Threading"] }
