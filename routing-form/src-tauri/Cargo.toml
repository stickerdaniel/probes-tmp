[package]
name = "routeprobe"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = "=2.12.7"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
